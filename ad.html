<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tagline Apparel · 15s Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:sans-serif}

/* ── AD FRAME ── */
.ad{
  width:390px;
  height:693px;
  position:relative;
  overflow:hidden;
  background:#07072A;
  cursor:pointer;
}

/* ── BACKGROUND IMAGE ── */
.ad-bg{
  position:absolute;inset:0;
  background-image:url('https://i.ibb.co/Jjr8GXmW/IMG-4172.jpg');
  background-size:150%;
  background-position:center top;
  animation:kenBurns 15s linear forwards;
  animation-play-state:paused;
}
@keyframes kenBurns{
  0%{transform:scale(1) translate(0,0)}
  100%{transform:scale(1.12) translate(-3%,-2%)}
}

/* ── OVERLAYS ── */
.ad-grad{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.15) 0%,
    rgba(0,0,0,.05) 40%,
    rgba(7,7,42,.75) 65%,
    rgba(7,7,42,.98) 100%
  );
}
.ad-noise{
  position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
  pointer-events:none;
  opacity:.4;
}

/* ── LOGO BAR ── */
.ad-logo{
  position:absolute;top:0;left:0;right:0;
  padding:28px 28px 0;
  display:flex;align-items:center;justify-content:space-between;
  animation:fadeDown .7s .3s both;
  animation-play-state:paused;
}
.ad-logo-text{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;letter-spacing:.35em;
  color:#fff;
}
.ad-logo-tag{
  font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.2);
  padding:4px 10px;
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-16px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── CONTENT AREA ── */
.ad-content{
  position:absolute;bottom:0;left:0;right:0;
  padding:0 32px 44px;
}

/* SCENE BASE */
.scene{
  position:absolute;bottom:0;left:0;right:0;
  padding:0 32px 44px;
  opacity:0;pointer-events:none;
}

/* ── SCENE 1: 0.8s – 4s ── */
.s1{animation:sceneIn 3.2s .8s both;animation-play-state:paused}
@keyframes sceneIn{
  0%{opacity:0;transform:translateY(18px)}
  12%{opacity:1;transform:translateY(0)}
  75%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-8px)}
}
.s1-eyebrow{
  font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(195,149,60,.9);margin-bottom:12px;
}
.s1-headline{
  font-family:'Bebas Neue',sans-serif;
  font-size:3rem;letter-spacing:.06em;line-height:1;
  color:#fff;margin-bottom:10px;
}
.s1-headline span{
  background:linear-gradient(135deg,#C3953C,#E8B84B);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.s1-sub{
  font-size:.75rem;letter-spacing:.08em;line-height:1.65;
  color:rgba(255,255,255,.6);
}

/* ── SCENE 2: 4.2s – 8.5s ── */
.s2{animation:sceneIn 4.3s 4.2s both;animation-play-state:paused}
.s2-label{
  font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:18px;
}
.pillars{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.pillar{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.6rem;letter-spacing:.1em;
  color:#fff;opacity:0;
  animation-play-state:paused;
}
.pillar.god{
  color:rgba(224,80,80,.9);
  animation:pillarIn .5s 4.8s both;
  animation-play-state:paused;
}
.pillar.health{
  color:rgba(80,200,120,.9);
  animation:pillarIn .5s 5.4s both;
  animation-play-state:paused;
}
.pillar.wealth{
  background:linear-gradient(135deg,#C3953C,#E8B84B);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:pillarIn .5s 6.0s both;
  animation-play-state:paused;
}
@keyframes pillarIn{
  from{opacity:0;transform:translateX(-20px)}
  to{opacity:1;transform:translateX(0)}
}
.s2-desc{
  font-size:.72rem;letter-spacing:.06em;line-height:1.65;
  color:rgba(255,255,255,.55);
  opacity:0;
  animation:fadeUp .5s 6.7s both;
  animation-play-state:paused;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── SCENE 3: 8.7s – 12.5s ── */
.s3{animation:sceneIn 3.8s 8.7s both;animation-play-state:paused}
.s3-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;letter-spacing:.12em;color:#fff;
  margin-bottom:6px;
}
.s3-sub{
  font-size:.65rem;letter-spacing:.1em;
  color:rgba(255,255,255,.4);margin-bottom:20px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.7);
  padding:6px 12px;
  opacity:0;
  animation-play-state:paused;
}
.chip:nth-child(1){animation:chipIn .4s 9.2s both;animation-play-state:paused}
.chip:nth-child(2){animation:chipIn .4s 9.5s both;animation-play-state:paused}
.chip:nth-child(3){animation:chipIn .4s 9.8s both;animation-play-state:paused}
.chip:nth-child(4){animation:chipIn .4s 10.1s both;animation-play-state:paused}
.chip:nth-child(5){animation:chipIn .4s 10.4s both;animation-play-state:paused}
.chip:nth-child(6){animation:chipIn .4s 10.7s both;animation-play-state:paused}
@keyframes chipIn{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}
.s3-free{
  margin-top:18px;
  font-family:'Cinzel',serif;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(195,149,60,.8);
  opacity:0;
  animation:fadeUp .5s 11.1s both;
  animation-play-state:paused;
}

/* ── SCENE 4: 12.7s – 15s ── */
.s4{animation:s4In 2.3s 12.7s both;animation-play-state:paused}
@keyframes s4In{
  0%{opacity:0;transform:translateY(22px)}
  20%{opacity:1;transform:translateY(0)}
  85%{opacity:1}
  100%{opacity:0}
}
.s4-qr{
  width:100px;height:100px;
  border:2px solid rgba(195,149,60,.5);
  padding:6px;
  background:#fff;
  margin-bottom:14px;
  opacity:0;
  animation:fadeUp .5s 13.1s both;
  animation-play-state:paused;
}
.s4-cta-label{
  font-size:.5rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:10px;
}
.s4-url{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:.12em;
  background:linear-gradient(135deg,#C3953C,#E8B84B);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.s4-tagline{
  font-family:'Cinzel',serif;
  font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.5);
}

/* ── FADE OUT at 15s ── */
.ad-fadeout{
  position:absolute;inset:0;background:#000;
  opacity:0;pointer-events:none;
  animation:fadeOut .6s 14.5s both;
  animation-play-state:paused;
}
@keyframes fadeOut{
  from{opacity:0}to{opacity:1}
}

/* ── RED ACCENT LINE ── */
.ad-accent{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(224,32,32,.8),transparent);
  animation:accentIn .8s .5s both;
  animation-play-state:paused;
}
@keyframes accentIn{
  from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}
}

/* ── PLAY BUTTON ── */
.play-btn{
  background:rgba(195,149,60,.15);border:1px solid rgba(195,149,60,.5);
  color:#E8B84B;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;
  padding:12px 32px;cursor:pointer;font-family:sans-serif;transition:background .2s;
}
.play-btn:hover{background:rgba(195,149,60,.3)}
.hint{font-size:.65rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-align:center}
</style>
</head>
<body>

<div class="ad" id="ad" onclick="playAd()">

  <!-- Background image -->
  <div class="ad-bg" id="adBg"></div>

  <!-- Gradient overlay -->
  <div class="ad-grad"></div>
  <div class="ad-noise"></div>

  <!-- Logo bar -->
  <div class="ad-logo" id="adLogo">
    <span class="ad-logo-text">TAGLINE</span>
    <span class="ad-logo-tag">Apparel</span>
  </div>

  <!-- Scene 1 -->
  <div class="scene s1">
    <h1 class="s1-headline">More Than<br><span>Clothes.</span></h1>
  </div>

  <!-- Scene 2 -->
  <div class="scene s2">
    <div class="pillars">
      <span class="pillar god">✝ GOD</span>
      <span class="pillar health">⚡ HEALTH</span>
      <span class="pillar wealth">🚀 WEALTH</span>
    </div>
  </div>

  <!-- Scene 3 -->
  <div class="scene s3">
    <h2 class="s3-title">Free. Daily.</h2>
    <div class="chips">
      <span class="chip">✝ Daily Verse</span>
      <span class="chip">🥗 Nutrition</span>
      <span class="chip">💰 Wealth Tips</span>
    </div>
    <p class="s3-free">No paywall. Ever.</p>
  </div>

  <!-- Scene 4 -->
  <div class="scene s4">
    <img class="s4-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://tagline.space&margin=0" alt="Scan to visit tagline.space">
    <p class="s4-cta-label">Scan or visit</p>
    <p class="s4-url">tagline.space</p>
    <p class="s4-tagline">God · Health · Wealth</p>
  </div>

  <!-- Accent line -->
  <div class="ad-accent" id="adAccent"></div>

  <!-- Fade to black -->
  <div class="ad-fadeout" id="adFadeout"></div>

</div>

<button class="play-btn" onclick="playAd()">▶ PLAY AD</button>
<p class="hint">Click the ad or press Play · 15 seconds · 9:16 format</p>
<p class="hint" style="margin-top:4px;font-size:.58rem">To record: use screen recorder cropped to the ad frame</p>

<script>
let playing = false;

function playAd(){
  if(playing) return;
  playing = true;

  // Reset all animations
  const all = document.querySelectorAll('[style*="animation"], .ad-bg, .ad-logo, .scene, .pillar, .chip, .s2-desc, .s3-free, .ad-accent, .ad-fadeout');
  document.querySelectorAll('.ad *').forEach(el=>{
    el.style.animationPlayState = 'paused';
  });

  // Force reflow to restart
  const ad = document.getElementById('ad');
  ad.querySelectorAll('*').forEach(el=>{
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = '';
  });

  // Start all animations
  setTimeout(()=>{
    ad.querySelectorAll('*').forEach(el=>{
      el.style.animationPlayState = 'running';
    });
    // Re-enable play after 15s
    setTimeout(()=>{ playing = false; }, 15500);
  }, 50);
}

// Auto-play on load
window.addEventListener('load', ()=> setTimeout(playAd, 500));
</script>
</body>
</html>
