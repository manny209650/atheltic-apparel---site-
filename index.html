<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TAGLINE — Coming Soon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#06060F;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;font-family:'Helvetica Neue',sans-serif;color:#fff;position:relative}

/* ── STARS ── */
.star{position:fixed;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) ease-in-out var(--del,0s) infinite alternate}
@keyframes twinkle{0%{opacity:var(--b,.7)}100%{opacity:.03}}

/* ── SHOOTING STARS ── */
.sstar{position:fixed;height:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,.5),transparent);border-radius:2px;pointer-events:none;transform-origin:left center;opacity:0}

/* ── ROCKET — floats above logo ── */
#rocket{font-size:3rem;display:block;margin-bottom:22px;position:relative;z-index:10;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── DECO ── */
#moon{position:fixed;top:10%;left:8%;font-size:2rem;pointer-events:none;z-index:1;animation:bob 8s ease-in-out infinite}
#planet{position:fixed;bottom:10%;right:6%;font-size:1.6rem;pointer-events:none;z-index:1;animation:bob 10s ease-in-out 2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ── CONTENT ── */
.content{position:relative;z-index:10}
.logo{font-size:clamp(2.6rem,9vw,4.8rem);font-weight:900;letter-spacing:.1em;margin-bottom:6px}
.tagline{font-size:.65rem;letter-spacing:.38em;text-transform:uppercase;color:#E02020;margin-bottom:10px}
.headline{font-size:clamp(1.2rem,4vw,1.9rem);font-weight:800;margin-bottom:10px}
.sub{font-size:.85rem;color:rgba(255,255,255,.38);max-width:320px;line-height:1.8;margin:0 auto 36px}

/* ── HUB CARDS ── */
.hubs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:480px;margin:0 auto}
.hub{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 12px 16px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:transform .22s,border-color .22s,background .22s,box-shadow .22s;-webkit-tap-highlight-color:transparent}
.hub:active{transform:scale(.96)}
.hub-icon{font-size:1.9rem;line-height:1}
.hub-name{font-size:.55rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#fff}
.hub-sub{font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);line-height:1.5}

/* Faith — purple */
.hub-faith{border-color:rgba(160,90,255,.22);background:rgba(120,50,220,.07)}
.hub-faith:hover,.hub-faith:focus{border-color:rgba(160,90,255,.55);background:rgba(120,50,220,.18);box-shadow:0 6px 22px rgba(120,50,220,.25);transform:translateY(-4px)}

/* Health — green */
.hub-health{border-color:rgba(0,210,100,.22);background:rgba(0,180,80,.07)}
.hub-health:hover,.hub-health:focus{border-color:rgba(0,220,100,.55);background:rgba(0,180,80,.18);box-shadow:0 6px 22px rgba(0,180,80,.25);transform:translateY(-4px)}

/* Wealth — gold */
.hub-wealth{border-color:rgba(220,170,0,.22);background:rgba(200,150,0,.07)}
.hub-wealth:hover,.hub-wealth:focus{border-color:rgba(220,170,0,.55);background:rgba(200,150,0,.18);box-shadow:0 6px 22px rgba(200,150,0,.25);transform:translateY(-4px)}

@media(max-width:400px){
  .hubs{grid-template-columns:1fr;max-width:260px}
  .hub{flex-direction:row;gap:14px;padding:14px 18px;text-align:left}
  .hub-icon{font-size:1.6rem}
  .hub-sub{display:none}
}
</style>
</head>
<body>

<div id="ufo">🛸</div>
<div id="moon">🌙</div>
<div id="planet">🪐</div>

<div class="content">
  <div id="rocket">🚀</div>
  <div class="logo">TAGLINE</div>
  <div class="tagline">God · Health · Wealth</div>
  <div class="headline">Something Big Is Coming</div>
  <p class="sub">Faith-forward athletic apparel built for believers who chase greatness.</p>

  <div class="hubs">
    <a href="god.html" class="hub hub-faith">
      <span class="hub-icon">✝️</span>
      <span class="hub-name">Faith Hub</span>
      <span class="hub-sub">God · Spirit<br>Purpose</span>
    </a>
    <a href="health.html" class="hub hub-health">
      <span class="hub-icon">💪</span>
      <span class="hub-name">Health Hub</span>
      <span class="hub-sub">Body · Mind<br>Nutrition</span>
    </a>
    <a href="wealth.html" class="hub hub-wealth">
      <span class="hub-icon">💰</span>
      <span class="hub-name">Wealth Hub</span>
      <span class="hub-sub">Money · Build<br>Grow</span>
    </a>
  </div>
</div>

<script>
/* ── STARS ── */
for(var i=0;i<100;i++){
  var s=document.createElement('div');s.className='star';
  var sz=Math.random()*2+0.4;
  s.style.cssText='width:'+sz+'px;height:'+sz+'px;background:#fff;top:'+Math.random()*100+'vh;left:'+Math.random()*100+'vw;--b:'+(Math.random()*0.6+0.15)+';--d:'+(Math.random()*3+1.5)+'s;--del:'+(Math.random()*4)+'s';
  document.body.appendChild(s);
}

/* ── SHOOTING STARS ── */
function spawnShoot(){
  var el=document.createElement('div');el.className='sstar';
  var w=Math.random()*110+60;
  el.style.cssText='width:'+w+'px;top:'+Math.random()*55+'vh;left:-'+w+'px';
  document.body.appendChild(el);
  var dur=Math.random()*500+450,start=null;
  var dx=window.innerWidth+w+80,dy=window.innerHeight*0.28;
  el.style.opacity='1';
  (function step(ts){
    if(!start)start=ts;
    var p=Math.min((ts-start)/dur,1);
    var fade=p<0.1?p/0.1:p>0.8?(1-p)/0.2:1;
    el.style.opacity=fade;
    el.style.transform='rotate(-30deg) translate('+(p*dx)+'px,'+(p*dy*0.4)+'px)';
    p<1?requestAnimationFrame(step):el.remove();
  })(0);
  setTimeout(spawnShoot,Math.random()*2000+1000);
}
spawnShoot();setTimeout(spawnShoot,600);setTimeout(spawnShoot,1400);

/* ── UFO — drifts left → right, bobs ── */
var ufo=document.getElementById('ufo'),uX=-80,uT=0;
(function animUFO(){
  uX+=0.5;if(uX>window.innerWidth+80)uX=-80;
  ufo.style.left=uX+'px';
  ufo.style.top=(window.innerHeight*0.1+Math.sin(uT*0.55)*16)+'px';
  uT+=0.016;requestAnimationFrame(animUFO);
})();
</script>
</body>
</html>
