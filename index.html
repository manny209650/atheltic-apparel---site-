<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TAGLINE — Coming Soon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#06060F;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:'Helvetica Neue',sans-serif;color:#fff;position:relative}

/* ── STARS ── */
.star{position:fixed;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) ease-in-out var(--delay,0s) infinite alternate}
@keyframes twinkle{0%{opacity:var(--bright,.8)}100%{opacity:.04}}

/* ── SHOOTING STARS ── */
.shoot{position:fixed;height:2px;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.6) 40%,transparent 100%);border-radius:2px;pointer-events:none;transform-origin:left center;transform:rotate(-32deg);opacity:0}

/* ── ORBITING ELEMENTS ── */
#rocket,#ufo{position:fixed;pointer-events:none;z-index:1;will-change:transform;font-size:1.8rem}

/* ── DECORATIVE SPACE BITS ── */
.deco{position:fixed;pointer-events:none;z-index:1;font-size:1.4rem}
#planet{bottom:12%;right:8%;animation:bob 7s ease-in-out infinite}
#moon{top:10%;left:8%;animation:bob 9s ease-in-out 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ── CONTENT ── */
.content{position:relative;z-index:10}
.logo{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:900;letter-spacing:.1em;margin-bottom:8px}
.tagline{font-size:.7rem;letter-spacing:.38em;text-transform:uppercase;color:#E02020;margin-bottom:40px}
.headline{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:800;margin-bottom:14px}
.sub{font-size:.92rem;color:rgba(255,255,255,.42);max-width:340px;line-height:1.8;margin-bottom:48px}
.links{display:flex;flex-direction:column;gap:14px;align-items:center}
.link-btn{font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.45);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:13px 30px;transition:border-color .2s,color .2s}
.link-btn:hover{border-color:rgba(255,255,255,.35);color:#fff}
</style>
</head>
<body>

<!-- Orbiting elements -->
<div id="rocket">🚀</div>
<div id="ufo">🛸</div>

<!-- Static space decorations -->
<div class="deco" id="planet">🪐</div>
<div class="deco" id="moon">🌙</div>

<!-- Main content -->
<div class="content">
  <div class="logo">TAGLINE</div>
  <div class="tagline">God · Health · Wealth</div>
  <div class="headline">Something Big Is Coming</div>
  <p class="sub">Faith-forward athletic apparel built for believers who chase greatness. Dropping soon.</p>
  <div class="links">
    <a href="god.html" class="link-btn">✝️ Faith Hub</a>
    <a href="health.html" class="link-btn">💪 Health Hub</a>
    <a href="wealth.html" class="link-btn">💰 Wealth Hub</a>
  </div>
</div>

<script>
/* ── STARS ── */
for(var i=0;i<110;i++){
  var s=document.createElement('div');
  s.className='star';
  var sz=Math.random()*2.2+0.4;
  s.style.cssText='width:'+sz+'px;height:'+sz+'px;background:#fff;top:'+Math.random()*100+'vh;left:'+Math.random()*100+'vw;--bright:'+(Math.random()*0.65+0.15)+';--d:'+(Math.random()*3+1.5)+'s;--delay:'+(Math.random()*4)+'s';
  document.body.appendChild(s);
}

/* ── SHOOTING STARS ── */
function spawnShoot(){
  var el=document.createElement('div');
  el.className='shoot';
  var w=Math.random()*120+70;
  var startTop=Math.random()*55;
  el.style.cssText='width:'+w+'px;top:'+startTop+'vh;left:-'+w+'px';
  document.body.appendChild(el);
  var duration=Math.random()*600+500;
  var distX=window.innerWidth+w+100;
  var distY=window.innerHeight*0.35;
  var start=null;
  el.style.opacity='1';
  function step(ts){
    if(!start)start=ts;
    var p=Math.min((ts-start)/duration,1);
    var ease=p<0.1?p/0.1:p>0.85?(1-p)/0.15:1;
    el.style.opacity=ease.toString();
    el.style.transform='rotate(-32deg) translate('+(p*distX)+'px,'+(p*distY*0.4)+'px)';
    if(p<1){requestAnimationFrame(step);}else{el.remove();}
  }
  requestAnimationFrame(step);
  setTimeout(spawnShoot, Math.random()*2200+1200);
}
spawnShoot();
setTimeout(spawnShoot, 700);
setTimeout(spawnShoot, 1600);

/* ── ROCKET — orbits elliptically around center, points in direction of travel ── */
var rk=document.getElementById('rocket');
var rAngle=0;
function animRocket(){
  var cx=window.innerWidth/2;
  var cy=window.innerHeight/2;
  var rx=Math.min(window.innerWidth*0.4,300);
  var ry=Math.min(window.innerHeight*0.32,210);
  var x=cx+rx*Math.cos(rAngle);
  var y=cy+ry*Math.sin(rAngle);
  /* velocity direction → rocket nose points in direction of travel */
  var vx=-rx*Math.sin(rAngle);
  var vy=ry*Math.cos(rAngle);
  var rot=Math.atan2(vx,-vy)*180/Math.PI;
  rk.style.left=x+'px';
  rk.style.top=y+'px';
  rk.style.transform='translate(-50%,-50%) rotate('+rot+'deg)';
  rAngle+=0.014;
  requestAnimationFrame(animRocket);
}
animRocket();

/* ── UFO — drifts slowly left→right at top, bobs gently, wraps ── */
var ufo=document.getElementById('ufo');
var uX=-80;
var uT=0;
function animUFO(){
  uX+=0.55;
  if(uX>window.innerWidth+80)uX=-80;
  var y=window.innerHeight*0.1+Math.sin(uT*0.6)*18;
  ufo.style.left=uX+'px';
  ufo.style.top=y+'px';
  uT+=0.018;
  requestAnimationFrame(animUFO);
}
animUFO();
</script>
</body>
</html>
