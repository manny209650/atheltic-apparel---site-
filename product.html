<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAGLINE — Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#E02020;--space:#06060F;--card:#0D0D25;--muted:#8A8AAA;--text:#DDE0F0;--border:rgba(255,255,255,.07)}
body{background:var(--space);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

/* ── NAV ── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);background:rgba(6,6,15,.95)}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:.1em;color:#fff;text-decoration:none}
.nav-logo span{color:var(--gold)}
.back-btn{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
.back-btn:hover{color:#fff}

/* ── LAYOUT ── */
.page{max-width:860px;margin:0 auto;padding:32px 20px 60px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media(max-width:600px){.product-grid{grid-template-columns:1fr}}

/* ── IMAGE ── */
.img-col{position:relative}
.product-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--card);display:block}
.product-badge{position:absolute;top:14px;left:14px;font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;font-weight:700}
.badge-new{background:#1B3DD8;color:#fff}
.badge-hot{background:var(--gold);color:#fff}
.badge-ltd{background:rgba(255,255,255,.15);color:#fff}

/* ── INFO ── */
.info-col{display:flex;flex-direction:column;gap:0;padding:4px 0}
.product-cat{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.product-name{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.05em;color:#fff;line-height:1;margin-bottom:8px}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--gold);margin-bottom:14px}
.product-desc{font-size:.82rem;line-height:1.7;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}

/* ── FIELD ── */
.field{margin-bottom:20px}
.field-label{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.field-label strong{color:#fff;font-size:.72rem;letter-spacing:.06em;text-transform:none}

/* ── COLOR SWATCHES ── */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.swatch:active{transform:scale(1.2)}
.swatch.sel{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}

/* ── SIZE CHIPS ── */
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.15);color:var(--muted);padding:10px 18px;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent;user-select:none}
.sz:active{background:rgba(224,32,32,.15)}
.sz.sel{border-color:var(--gold);color:#fff;background:rgba(224,32,32,.12)}

/* ── BUY BUTTON ── */
.buy-btn{display:block;width:100%;margin-top:auto;padding-top:24px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;background:#1a1a2e;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);padding:16px;text-align:center;cursor:not-allowed;margin-top:28px}
.buy-btn.active{background:linear-gradient(135deg,#FF3333,#E02020);color:#fff;cursor:pointer;border:none}
.buy-btn.active:active{opacity:.85}

.coming-note{font-size:.65rem;letter-spacing:.12em;color:rgba(255,255,255,.25);text-align:center;margin-top:10px}

/* ── NOT FOUND ── */
.not-found{text-align:center;padding:80px 24px;color:var(--muted)}
.not-found h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#fff;margin-bottom:12px}
</style>
</head>
<body>

<div class="nav">

function badgeClass(b){return b==='New'?'badge-new':b==='Best Seller'||b==='Bestseller'?'badge-hot':'badge-ltd';}

var handle = new URLSearchParams(window.location.search).get('h');
var p = PRODUCTS.find(function(x){return x.handle===handle;});

if(!p){
  document.getElementById('notFound').style.display='block';
} else {
  document.title = 'TAGLINE — '+p.title;
  var cat = (p.cats||[]).find(function(c){return c!=='all';}) || '';
  var page = document.getElementById('page');
  page.innerHTML =
    '<div class="product-grid">'
      +'<div class="img-col">'
        +'<img class="product-img" src="'+p.img+'" alt="'+p.title+'">'
        +(p.badge?'<div class="product-badge '+badgeClass(p.badge)+'">'+p.badge+'</div>':'')
      +'</div>'
      +'<div class="info-col">'
        +'<p class="product-cat">'+cat.replace(/-/g,' ')+'</p>'
        +'<h1 class="product-name">'+p.title+'</h1>'
        +(p.price>0?'<p class="product-price">$'+p.price+'</p>':p.badge==='Custom'?'<p class="product-price" style="font-size:1rem">$5 Lock · Custom Quote</p>':'')
        +'<p class="product-desc">'+p.desc+'</p>'
        +(p.colors&&p.colors.length?
          '<div class="field"><div class="field-label">Color &nbsp;<strong id="colorName">'+p.colors[0].replace(/-/g,' ')+'</strong></div>'
          +'<div class="swatches">'
          +p.colors.map(function(c,i){return '<div class="swatch'+(i===0?' sel':'')+'" style="background:'+gc(c)+'" data-c="'+c+'" onclick="pickColor(this)" title="'+c.replace(/-/g,' ')+'"></div>';}).join('')
          +'</div></div>':'')
        +(p.sizes&&p.sizes.length?
          '<div class="field"><div class="field-label">Size &nbsp;<strong id="sizeName">'+p.sizes[0]+'</strong></div>'
          +'<div class="sizes">'
          +p.sizes.map(function(s,i){return '<div class="sz'+(i===0?' sel':'')+'" data-s="'+s+'" onclick="pickSize(this)">'+s+'</div>';}).join('')
          +'</div></div>':'')
        +'<div class="buy-btn" id="buyBtn">🔒 Coming Soon</div>'
        +'<p class="coming-note">Shop opens soon — check back shortly</p>'
      +'</div>'
    +'</div>';
}

function pickColor(el){
  document.querySelectorAll('.swatch').forEach(function(s){s.classList.remove('sel');});
  el.classList.add('sel');
  document.getElementById('colorName').textContent = el.getAttribute('data-c').replace(/-/g,' ');
}
function pickSize(el){
  document.querySelectorAll('.sz').forEach(function(s){s.classList.remove('sel');});
  el.classList.add('sel');
  document.getElementById('sizeName').textContent = el.getAttribute('data-s');
}
